services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  xberg-api:
    image: ghcr.io/xberg-io/xberg:1.2.9
    ports:
      - "8000:8000"
    environment:
      - XBERG_CORS_ORIGINS=*
      - XBERG_MAX_REQUEST_BODY_BYTES=524288000
      - RUST_LOG=info
    volumes:
      - cache-data:/app/.xberg
    command: serve --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "xberg", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
  cache-data: